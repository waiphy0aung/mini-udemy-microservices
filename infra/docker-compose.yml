services:
  # ===== Databases =====
  user-db:
    image: postgres:15-alpine
    container_name: mini-udemy-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER_DB_USER:-user_service}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_password}
      POSTGRES_DB: ${USER_DB_NAME:-user_service}
    ports:
      - "${USER_DB_HOST_PORT:-5433}:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
      - ./postgres/init/01-user-service.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - user-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-user_service} -d ${USER_DB_NAME:-user_service}"]
      interval: 10s
      timeout: 5s
      retries: 5

  course-db:
    image: postgres:15-alpine
    container_name: mini-udemy-course-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${COURSE_DB_USER:-course_service}
      POSTGRES_PASSWORD: ${COURSE_DB_PASSWORD:-course_password}
      POSTGRES_DB: ${COURSE_DB_NAME:-course_service}
    ports:
      - "${COURSE_DB_HOST_PORT:-5434}:5432"
    volumes:
      - course_db_data:/var/lib/postgresql/data
      - ./postgres/init/02-course-service.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - course-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COURSE_DB_USER:-course_service} -d ${COURSE_DB_NAME:-course_service}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Video Service Database (Using MongoDB for file metadata) =====
  video-db:
    image: mongo:6-jammy
    container_name: mini-udemy-video-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${VIDEO_DB_USER:-video_service}
      MONGO_INITDB_ROOT_PASSWORD: ${VIDEO_DB_PASSWORD:-video_password}
      MONGO_INITDB_DATABASE: ${VIDEO_DB_NAME:-video_service}
    ports:
      - "${VIDEO_DB_HOST_PORT:-27018}:27017"
    volumes:
      - video_db_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - video-db-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Payment Service Database (Separate for PCI compliance) =====
  payment-db:
    image: postgres:15-alpine
    container_name: mini-udemy-payment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment_service}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_password}
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_service}
    ports:
      - "${PAYMENT_DB_HOST_PORT:-5435}:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
      - ./postgres/init/03-payment-service.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - payment-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER:-payment_service} -d ${PAYMENT_DB_NAME:-payment_service}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Analytics Database (Time-series for metrics) =====
  analytics-db:
    image: timescale/timescaledb:latest-pg15
    container_name: mini-udemy-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ANALYTICS_DB_USER:-analytics_service}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics_password}
      POSTGRES_DB: ${ANALYTICS_DB_NAME:-analytics_service}
    ports:
      - "${ANALYTICS_DB_HOST_PORT:-5436}:5432"
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    networks:
      - analytics-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER:-analytics_service} -d ${ANALYTICS_DB_NAME:-analytics_service}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - cache-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Message Queue =====
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mini-udemy-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-mini_udemy}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - message-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  # ===== Monitoring Stack =====
  prometheus:
    image: prom/prometheus:latest
    container_name: mini-udemy-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: mini-udemy-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring-network
    profiles:
      - monitoring

  # ===== Application Services =====
  user-service:
    build:
      context: ..
      dockerfile: infra/dockerfiles/Dockerfile.service
      args:
        SERVICE_DIR: services/user-service
    container_name: mini-udemy-user-service
    restart: unless-stopped
    env_file:
      - ./env/base.env
      - ./env/user-service.env
    environment:
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql://${USER_DB_USER:-user_service}:${USER_DB_PASSWORD:-user_password}@user-db:5432/${USER_DB_NAME:-user_service}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-password}@rabbitmq:5672
    ports:
      - "${USER_SERVICE_PORT:-3001}:3001"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
      - user-db-network
      - cache-network
      - message-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    build:
      context: ..
      dockerfile: infra/dockerfiles/Dockerfile.gateway
    container_name: mini-udemy-gateway
    restart: unless-stopped
    env_file:
      - ./env/base.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      USER_SERVICE_URL: http://user-service:3001
      COURSE_SERVICE_URL: http://course-service:3002
      VIDEO_SERVICE_URL: http://video-service:3003
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      - user-service
    # volumes:
    #   - app_logs:/app/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Development Tools =====
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mini-udemy-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - app-network
    profiles:
      - dev

  adminer:
    image: adminer:latest
    container_name: mini-udemy-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - database-network
    profiles:
      - dev

networks:
  app-network:
    driver: bridge
    name: mini-udemy-app
  user-db-network:
    driver: bridge
    name: mini-udemy-user-db
  course-db-network:
    driver: bridge
    name: mini-udemy-course-db
  video-db-network:
    driver: bridge
    name: mini-udemy-video-db
  payment-db-network:
    driver: bridge
    name: mini-udemy-payment-db
  analytics-db-network:
    driver: bridge
    name: mini-udemy-analytics-db
  cache-network:
    driver: bridge
    name: mini-udemy-cache
  message-network:
    driver: bridge
    name: mini-udemy-message

volumes:
  user_db_data:
    name: mini-udemy-user-db-data
  course_db_data:
    name: mini-udemy-course-db-data
  video_db_data:
    name: mini-udemy-video-db-data
  payment_db_data:
    name: mini-udemy-payment-db-data
  analytics_db_data:
    name: mini-udemy-analytics-db-data
  redis_data:
    name: mini-udemy-redis-data
  rabbitmq_data:
    name: mini-udemy-rabbitmq-data
  video_storage:
    name: mini-udemy-video-storage
